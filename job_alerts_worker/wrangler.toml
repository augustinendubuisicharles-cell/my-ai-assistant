# Cloudflare Worker for the job alerts sign-up website. Deployed by
# .github/workflows/job_alerts_worker.yml; secrets are set there from GitHub secrets.
name = "job-alerts"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
SITE_NAME = "JobAlert"
GITHUB_REPO = "augustinendubuisicharles-cell/my-ai-assistant"   # where the first-search workflow lives

[observability]
enabled = true

[triggers]
crons = ["0 6 * * *"]   # 7am Lagos: starts the morning emails (GitHub's own schedule can run hours late)
