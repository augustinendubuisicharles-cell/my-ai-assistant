<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;font-family:Inter,sans-serif}
body{background:linear-gradient(135deg,#0f1f4d 0%,#2457d6 100%);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 90px;box-sizing:border-box;position:relative;overflow:hidden}
.brand{display:flex;align-items:center;gap:26px;margin-bottom:40px}
.brand img{width:112px;height:112px;border-radius:26px;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.brand span{font-size:76px;font-weight:800;letter-spacing:-2px}
.brand b{color:#ffc75a}
h1{font-size:54px;line-height:1.15;font-weight:700;margin:0 0 36px;max-width:960px;letter-spacing:-1px}
.chips{display:flex;gap:16px}
.chips div{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.28);border-radius:40px;padding:12px 26px;font-size:28px;font-weight:600}
.url{position:absolute;right:90px;bottom:44px;font-size:28px;font-weight:600;opacity:.85}
.ring{position:absolute;right:-140px;top:-140px;width:520px;height:520px;border-radius:50%;border:70px solid rgba(255,255,255,.06)}
</style></head><body>
<div class="ring"></div>
<div class="brand"><img src="mark.svg"><span>Job<b>Alert</b></span></div>
<h1>Fresh remote and local jobs in your inbox every morning</h1>
<div class="chips"><div>7 days free</div><div>Checked for scams</div><div>No repeats</div></div>
<div class="url">jobalert.me.uk</div>
</body></html>
