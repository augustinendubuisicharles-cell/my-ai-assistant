# Render blueprint for the job alerts sign-up site (job_alerts/).
# The daily emails are sent by .github/workflows/job_alerts_daily.yml, not by Render.
services:
  - type: web
    name: job-alerts
    runtime: python
    plan: free
    region: frankfurt   # nearest Render region to the London Neon database
    buildCommand: pip install -r job_alerts/requirements.txt
    startCommand: uvicorn job_alerts.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false
      - key: BASE_URL
        sync: false
      - key: SITE_NAME
        value: Job Alerts
      - key: BREVO_API_KEY    # Render's free plan blocks SMTP ports, so the site sends through Brevo's API
        sync: false
      - key: PAYSTACK_SECRET_KEY  # sk_test_... to try it out, sk_live_... to take real money
        sync: false
      - key: CONTACT_EMAIL        # shown on the terms page; defaults to FROM_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FROM_EMAIL
        sync: false
