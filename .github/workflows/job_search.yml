name: Daily job search

on:
  schedule:
    - cron: "0 7 * * *"   # 8am UK time while on BST (summer)
    - cron: "0 8 * * *"   # 8am UK time while on GMT (winter)
  workflow_dispatch:       # lets you trigger it by hand from the Actions tab, for testing

jobs:
  search-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r job_bot/requirements.txt
      - name: Search and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        working-directory: job_bot
        run: python run.py
