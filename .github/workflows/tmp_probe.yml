name: tmp probe
on:
  push:
    branches: [claude/project-thread-uc24a3]
    paths: [tmp_probe/**, .github/workflows/tmp_probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r job_alerts/requirements.txt
      - run: python -m tmp_probe.probe
        env:
          DATABASE_URL: ${{ secrets.JOB_ALERTS_DATABASE_URL }}
