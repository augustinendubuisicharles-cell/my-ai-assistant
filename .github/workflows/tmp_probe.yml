name: tmp probe
on:
  push:
    branches: [claude/project-thread-uc24a3]
    paths: [tmp_probe/**]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests && python tmp_probe/discover.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add job_alerts/career_pages.json
          git commit -m "Company job boards found by the discovery probe"
          git push
