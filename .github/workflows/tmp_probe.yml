name: tmp probe
on:
  push:
    branches: [claude/project-thread-uc24a3]
    paths: [tmp_probe/**, job_alerts/search.py]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r job_alerts/requirements.txt
      - run: /usr/bin/time -v python -m tmp_probe.coverage 2>&1 | grep -v "^\s*$" | tail -80
        env:
          DATABASE_URL: ${{ secrets.JOB_ALERTS_DATABASE_URL }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
