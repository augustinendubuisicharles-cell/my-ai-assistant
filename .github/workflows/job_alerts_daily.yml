name: Job alerts -- daily emails to subscribers

on:
  schedule:
    - cron: "0 6 * * *"   # 7am Lagos / 7am London (winter)
  workflow_dispatch:
    inputs:
      only_email:
        description: "Test: send only to this subscriber's email (leave empty to email everyone)"
        required: false
        default: ""
      first:
        description: "First search for a new subscriber (set by the website): skip anyone who already has jobs"
        required: false
        default: "0"
  pull_request:             # smoke test: preview a live search when the service code changes (no emails)
    paths:
      - "job_alerts/**"
      - ".github/workflows/job_alerts_daily.yml"

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r job_alerts/requirements.txt
      - run: python -m job_alerts.search "virtual assistant, public relations" Nigeria entry
      - run: python -m job_alerts.search "data analyst" "United Kingdom" any

  db-check:
    # On PRs, prove the database and email secrets work (each skips until its secrets are set)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.JOB_ALERTS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r job_alerts/requirements.txt
      - name: Check the database
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "JOB_ALERTS_DATABASE_URL not set yet -- skipping."; exit 0; fi
          python -m job_alerts.check_db
      - name: Check the email login (sends nothing)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: |
          if [ -z "$SMTP_USER" ]; then echo "SMTP secrets not set yet -- skipping."; exit 0; fi
          python -m job_alerts.check_smtp

  send:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the service is set up
        id: check
        env:
          DATABASE_URL: ${{ secrets.JOB_ALERTS_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "JOB_ALERTS_DATABASE_URL secret not set yet -- skipping (see job_alerts/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.check.outputs.ready == 'true'
        run: pip install -r job_alerts/requirements.txt
      - if: steps.check.outputs.ready == 'true'
        name: Find matches and email everyone
        env:
          DATABASE_URL: ${{ secrets.JOB_ALERTS_DATABASE_URL }}
          BASE_URL: ${{ secrets.JOB_ALERTS_BASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          FROM_NAME: JobAlert
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}   # same sender as the website; SMTP is the fallback
          ONLY_EMAIL: ${{ inputs.only_email }}
          FIRST_SEARCH: ${{ inputs.first }}
          COVER_LETTERS: ${{ secrets.JOB_ALERTS_ANTHROPIC_KEY != '' && '1' || '0' }}   # members' emails link to AI cover letters
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          # Only used to tell whether payments are switched on (renew link vs "trial ending" note)
          CREDO_PUBLIC_KEY: ${{ secrets.CREDO_PUBLIC_KEY }}
          CREDO_SECRET_KEY: ${{ secrets.CREDO_SECRET_KEY }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
        run: python -m job_alerts.send_daily
