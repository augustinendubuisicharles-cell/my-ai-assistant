name: Job alerts -- dashboard check

# Opens the live dashboard the way the owner does (login page, then the password from
# the JOB_ALERTS_ADMIN_KEY secret) and says what works. Never prints the password.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          ADMIN_KEY: ${{ secrets.JOB_ALERTS_ADMIN_KEY }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          SITE="${BASE_URL:-https://jobalert.me.uk}"; SITE="${SITE%/}"
          KEY="$(printf '%s' "$ADMIN_KEY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          echo "Secret JOB_ALERTS_ADMIN_KEY: ${#KEY} characters (needs 12 or more)"
          ok=1
          code=$(curl -sS -o /tmp/login.html -w '%{http_code}' "$SITE/admin")
          if grep -q 'type="password"' /tmp/login.html; then echo "PASS  $SITE/admin shows the password box ($code)"
          else echo "FAIL  $SITE/admin returned $code without the password box: the site has no usable ADMIN_KEY"; ok=0; fi
          code=$(curl -sS -o /tmp/dash.html -w '%{http_code}' --data-urlencode "key=$KEY" "$SITE/admin")
          if grep -q 'active users searched' /tmp/dash.html; then echo "PASS  the saved password opens the dashboard ($code)"
          else echo "FAIL  the saved password did not open the dashboard ($code)"; ok=0; fi
          case "$(printf '%s' "$PAYSTACK_SECRET_KEY" | tr -d '[:space:]')" in
            sk_live_*) echo "INFO  PAYSTACK_SECRET_KEY is a live key (sk_live_...)";;
            sk_test_*) echo "WARN  PAYSTACK_SECRET_KEY is a TEST key: real customers can't pay";;
            "") echo "INFO  PAYSTACK_SECRET_KEY is not set";;
            *) echo "WARN  PAYSTACK_SECRET_KEY doesn't look like a Paystack secret key";;
          esac
          if grep -q 'On</span> Payments (Paystack)' /tmp/dash.html; then echo "PASS  the dashboard shows Paystack payments switched on"
          else echo "INFO  the dashboard does not show Paystack payments on"; fi
          [ "$ok" = 1 ]
