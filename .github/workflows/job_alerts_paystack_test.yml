name: Job alerts -- Paystack test payment

# Runs a ₦5,000 test-mode payment through the site's payment code. Uses the
# PAYSTACK_TEST_SECRET_KEY secret; the live site and database are not touched.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Also email JobAlert's receipt for the test payment to this address (optional)"
        required: false
        default: ""

jobs:
  test-payment:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job_alerts_worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - env:
          PAYSTACK_TEST_SECRET_KEY: ${{ secrets.PAYSTACK_TEST_SECRET_KEY }}
          EMAIL: ${{ inputs.email }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: node scripts/paystack_test.mjs
