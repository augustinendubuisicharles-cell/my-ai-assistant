name: Job alerts -- refresh company job boards
on:
  schedule:
    - cron: "0 3 1 * *"  # 1st of each month, 03:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r job_alerts/requirements.txt
      - run: python -m job_alerts.discover_boards
      - name: Save the updated list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add job_alerts/career_pages.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh company job boards"
          git push
