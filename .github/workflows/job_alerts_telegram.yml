name: Job alerts -- Telegram alerts for paying members

on:
  schedule:
    - cron: "0 9,12,15,18 * * *"   # 10am, 1pm, 4pm and 7pm Lagos
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check Telegram alerts are set up
        id: check
        env:
          DATABASE_URL: ${{ secrets.JOB_ALERTS_DATABASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.JOB_ALERTS_TELEGRAM_TOKEN }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$TELEGRAM_TOKEN" ]; then
            echo "JOB_ALERTS_TELEGRAM_TOKEN not set yet -- skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job_alerts/requirements.txt
      - if: steps.check.outputs.ready == 'true'
        run: pip install -r job_alerts/requirements.txt
      - if: steps.check.outputs.ready == 'true'
        name: Send new matches on Telegram
        env:
          DATABASE_URL: ${{ secrets.JOB_ALERTS_DATABASE_URL }}
          JOB_ALERTS_TELEGRAM_TOKEN: ${{ secrets.JOB_ALERTS_TELEGRAM_TOKEN }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
        run: python -m job_alerts.send_telegram
